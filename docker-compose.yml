version: '3.8'

services:
  client:
    build:
      context: ./client
      target: dev
    ports:
      - '5173:5173'
    volumes:
      - ./client:/app
      - /app/node_modules
    env_file:
      - ./client/.env
    depends_on:
      - server

  server:
    build:
      context: ./server
      target: dev
    ports:
      - '3000:3000'
    volumes:
      - ./server:/app
      - /app/node_modules
    env_file:
      - ./server/.env
